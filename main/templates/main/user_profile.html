{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user profile</title>
    <link rel="stylesheet" type="text/css" href="{% static 'main/profile_style.css' %}" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="header-bar">
        <div>
            <h1>Профиль</h1>
        </div>
        <a class="categoriee" href="{% url 'category-list' %}">Списки задач</a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
        {% endif %}
    </div>
    <!--{{ user.username }}-->
    <div class="task-wrapper">
        <span class="name">Ваше имя: {{ user.username }}</span>

        <!--<button class="connect_btn" >Подключить telegram</button>-->
        <button onclick="connectTelegram()">Подключить Telegram уведомления</button>
        <script>
            function connectTelegram() {
                // Открываем Telegram бота
                window.open("https://t.me/todoList_notifications_bot?start=connect", "_blank");
                
                // Запрашиваем chat_id у пользователя
                const chatId = prompt("Введите ваш Telegram Chat ID (после запуска бота отправьте ему /id)");
                
                if (chatId) {
                    fetch('/api/enable_notifications/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            telegram_id: chatId,
                            chat_id: chatId
                        })
                    }).then(response => {
                        alert("Уведомления успешно подключены!");
                    });
                }
            }
            </script>
    </div>
</body>
</html>
